# 每日資安掃描。本 workflow 持有可連進正式機的 GCP 憑證與各服務 HMAC 金鑰，
# 因此：只允許 schedule／workflow_dispatch 觸發（不可加 pull_request／push）、
# 權限最小化、checkout 不留憑證、所有 ${{ }} 一律經 env 傳入。
# 第三方 action 一律釘 commit SHA（後面註解為對應 release tag，2026-11-18 以 gh api 查得）。
name: security-scan

on:
  schedule:
    - cron: '7 22 * * *' # UTC；台灣 06:07
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      count: ${{ steps.read.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: |
          matrix="$(jq -c '[.[] | {service, kind, secretEnv, repo}]' security/targets.json)"
          count="$(printf '%s' "$matrix" | jq 'length')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  scan:
    needs: targets
    if: needs.targets.outputs.count != '0'
    runs-on: ubuntu-latest
    # 依目標種類分 environment：讓 GCP workload identity 的 attribute condition 可以只信任
    # security-vm 這個 environment 的 OIDC sub，hosted job 的權杖因此換不到 GCP 權限。
    # kind 來自版控的 security/targets.json，值只會是 vm 或 hosted。
    environment: ${{ matrix.target.kind == 'vm' && 'security-vm' || 'security-hosted' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # VM 目標：以 Workload Identity 取得 GCP 憑證，再用 IAP 連進 VM
      - name: GCP 驗證
        if: matrix.target.kind == 'vm'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: 安裝 gcloud
        if: matrix.target.kind == 'vm'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # deps 檢查：runner 端逐一拉取 VM 上容器使用的映像檔並以 osv-scanner 掃描
      # 這兩個 step 失敗不可讓整個 job 失敗（八項檢查的快照仍要推送）：
      # 失敗時 OSV_SCANNER_BIN 沒設定或 docker 未登入，runner 對每個映像檔回報 error，deps 因此為 unknown（spec §5.10）。
      - name: 設定 Artifact Registry 登入
        if: matrix.target.kind == 'vm'
        continue-on-error: true
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      # osv-scanner 釘版（v2.7.1）並驗 SHA-256；不新增第三方 action
      - name: 安裝 osv-scanner
        if: matrix.target.kind == 'vm'
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "OSV_SCANNER_BIN=$RUNNER_TEMP/osv-scanner" >> "$GITHUB_ENV"

      # hosted 目標：checkout 原始碼供 CLI 取 lockfile。此 step 與 corepack 都不執行該 repo 的程式碼。
      # CLI 的稽核在全新暫存目錄執行：寫入淨化過的 package.json（只留 dependencies 類）並複製 lockfile，
      # 且子行程只拿最小環境（拿不到 HMAC 金鑰、Anthropic 識別資訊、OIDC 權杖）；不 install。
      - name: checkout 目標 repo
        if: matrix.target.kind == 'hosted'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.target.repo }}
          ssh-key: ${{ secrets.SECURITY_TARGET_REPO_KEY }}
          path: target-repo
          persist-credentials: false

      - name: 啟用 corepack（pnpm）
        if: matrix.target.kind == 'hosted'
        run: |
          corepack enable
          # 由本 workflow 釘住 pnpm 版本，不受目標 repo 的 packageManager 欄位影響
          # （此 step 的工作目錄是本 repo 根目錄，不是 target-repo/）。
          corepack prepare pnpm@10.32.1 --activate

      - name: 掃描
        env:
          TARGET_SERVICE: ${{ matrix.target.service }}
          # CLI 的 BEACON_URL 是 base URL（不含路徑）
          BEACON_URL: ${{ vars.BEACON_URL }}
          BEACON_SECRET: ${{ secrets[matrix.target.secretEnv] }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
          TARGET_REPO_DIR: target-repo
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # 選填：federation rule 綁定多個 workspace 時換權杖必須帶；未設定時為空字串，CLI 會略過
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: node scripts/security/scan.mts --target "$TARGET_SERVICE"

      # 心跳：成功失敗都要回報；心跳尚未登記時端點回 404，不可讓 job 因此失敗
      - name: 心跳
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 心跳腳本的 BEACON_URL 是完整端點，與掃描步驟的 base URL 不同
          BEACON_BASE_URL: ${{ vars.BEACON_URL }}
          BEACON_SERVICE: ${{ matrix.target.service }}
          BEACON_SECRET: ${{ secrets[matrix.target.secretEnv] }}
        run: |
          status=fail
          if [ "$JOB_STATUS" = "success" ]; then status=pass; fi
          BEACON_URL="${BEACON_BASE_URL%/}/api/heartbeat" \
            bash scripts/heartbeat-to-beacon.sh security-scan "$status" "$RUN_URL" || true
